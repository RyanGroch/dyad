# TEMPORARY test workflow for the PostHog source map upload (fork only, never merged).
# The build job mirrors release.yml's, but runs `npm run package` unsigned instead of
# publishing. The upload-sourcemaps job is copied verbatim from release.yml.
name: Test PostHog source maps
on:
  push:
    branches: [test/posthog-sourcemaps-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Stand-in for release.yml's prepare-release, which outputs package.json's version.
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - id: v
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        os:
          - { name: "windows", image: "windows-2022" }
          - { name: "linux", image: "ubuntu-22.04" }
          - { name: "macos-intel", image: "macos-26-intel" }
          - { name: "macos", image: "macos-latest" }
    name: build ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.image }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: v24.13.1
          package-manager-cache: false
      - run: npm install -g npm@11.8.0
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Use clang 18 for Linux native rebuilds
        if: matrix.os.name == 'linux'
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO /tmp/llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --dearmor /tmp/llvm-snapshot.gpg.key
          sudo install -m 0644 /tmp/llvm-snapshot.gpg.key.gpg /etc/apt/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy-18.list
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list.d/llvm-toolchain-jammy-18.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y clang-18
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"
      - name: Package app (same PostHog env as release.yml)
        shell: bash
        env:
          # Skips macOS signing/notarization only; the bundles are identical.
          E2E_TEST_BUILD: "true"
          NODE_OPTIONS: "--max-old-space-size=6144"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTHOG_UPLOAD_SOURCEMAPS: "true"
          POSTHOG_SOURCEMAPS_DIR: ${{ runner.temp }}/posthog-sourcemaps
        run: npm run package
      - name: Verify packaged bundles
        shell: bash
        env:
          POSTHOG_SOURCEMAPS_DIR: ${{ runner.temp }}/posthog-sourcemaps
        run: node scripts/ci-test-verify-posthog-sourcemaps.mjs
      - name: Upload source maps artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: posthog-sourcemaps-${{ matrix.os.name }}
          path: ${{ runner.temp }}/posthog-sourcemaps/
          if-no-files-found: error
          retention-days: 1
      # Keep the Linux app to throw real errors from it locally.
      - name: Upload packaged app (Linux only)
        if: matrix.os.name == 'linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packaged-linux
          path: out/
          retention-days: 1

  # ---- Verbatim from release.yml (below this line) ----
  upload-sourcemaps:
    name: Upload source maps to PostHog
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download source maps
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ${{ runner.temp }}/sourcemaps
          pattern: posthog-sourcemaps-*

      - name: Install posthog-cli
        # Verify the archive before extracting it. When bumping the version,
        # update the hash from the release's .sha256 file.
        env:
          VERSION: "0.18.12"
          SHA256: 313458fd8caf7adec1d15e59b2a1abcc2e9ff52a00e54cad181ec052daa50b25
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o posthog-cli.tar.gz \
            "https://github.com/PostHog/posthog/releases/download/posthog-cli%2Fv${VERSION}/posthog-cli-x86_64-unknown-linux-gnu.tar.gz"
          echo "${SHA256}  posthog-cli.tar.gz" | sha256sum -c -
          tar -xzf posthog-cli.tar.gz --strip-components=1 posthog-cli-x86_64-unknown-linux-gnu/posthog-cli

      - name: Upload source maps
        # Chunk IDs are content hashes, so maps shared across platforms, or
        # already uploaded by an earlier run of this release, are skipped.
        # Symbol sets are never deleted, so older releases keep resolving.
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_SOURCEMAP_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_CLI_HOST: "https://us.posthog.com"
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$POSTHOG_CLI_API_KEY" ] || [ -z "$POSTHOG_CLI_PROJECT_ID" ]; then
            echo "::error::Set the POSTHOG_SOURCEMAP_API_KEY secret and POSTHOG_PROJECT_ID variable at repository level. This job does not use the release environment." >&2
            exit 1
          fi
          shopt -s nullglob
          dirs=("$RUNNER_TEMP"/sourcemaps/posthog-sourcemaps-*/*/)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "No source maps were staged by the build jobs" >&2
            exit 1
          fi
          for dir in "${dirs[@]}"; do
            echo "Uploading $dir"
            "$RUNNER_TEMP/posthog-cli" sourcemap upload --directory "$dir" \
              --release-name dyad --release-version "$RELEASE_VERSION"
          done
